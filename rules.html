<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARWatch — Rules</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app">

    <nav class="navbar">
      <div class="navbar__inner">
        <a href="index.html" class="navbar__brand">HARWatch</a>
        <button class="navbar__toggle" aria-label="Toggle menu">☰</button>
        <div class="navbar__links">
          <a href="index.html">Upload</a>
          <a href="report.html">Report</a>
          <a href="waterfall.html">Waterfall</a>
          <a href="rules.html" class="active">Rules</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="container">

        <header class="flex flex--between">
          <div>
            <h1>Detection rules</h1>
            <p class="text-muted">Manage the rules HARWatch uses to flag issues.</p>
          </div>
          <button id="new-rule-btn" type="button">+ New rule</button>
        </header>

        <section aria-labelledby="rules-heading">
          <h2 id="rules-heading" class="sr-only">Rules list</h2>
          <ul id="rules-list" class="rules-list">
          </ul>
        </section>
        <dialog id="rule-form-dialog">
          <form id="rule-form" method="dialog">
            <h2 id="rule-form-title">New rule</h2>

            <label for="rule-name">Name</label>
            <input id="rule-name" name="name" type="text" required>

            <label for="rule-field">Field to check</label>
            <select id="rule-field" name="field">
              <option value="ttfb">Time to first byte</option>
              <option value="size">Response size</option>
              <option value="status">Status code</option>
              <option value="compression">Compression header</option>
              <option value="cache">Cache header</option>
            </select>

            <label for="rule-operator">Condition</label>
            <select id="rule-operator" name="operator">
              <option value="gt">Greater than</option>
              <option value="lt">Less than</option>
              <option value="equals">Equals</option>
              <option value="missing">Is missing</option>
            </select>

            <label for="rule-value">Value</label>
            <input id="rule-value" name="value" type="text">

            <label for="rule-severity">Severity</label>
            <select id="rule-severity" name="severity">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>

            <label for="rule-fix">Fix suggestion</label>
            <textarea id="rule-fix" name="fix" rows="2"></textarea>

            <div class="flex flex--between">
              <button type="button" id="cancel-rule-btn">Cancel</button>
              <button type="submit">Save rule</button>
            </div>
          </form>
        </dialog>

      </div>
    </main>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
