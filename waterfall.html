<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HARWatch — Waterfall</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

<div class="app">

    <nav class="navbar">
        <div class="navbar__inner">

            <a href="index.html" class="navbar__brand">
                HARWATCH
            </a>

            <button class="navbar__toggle" aria-label="Toggle menu">☰</button>

            <div class="navbar__links">
                <a href="index.html">Upload</a>
                <a href="report.html">Report</a>
                <a href="waterfall.html" class="active">Waterfall</a>
                <a href="rules.html">Rules</a>
            </div>

        </div>
    </nav>


    <main>

        <div class="container">

            <header class="waterfall-header">

                <div>
                    <span class="section-label">REQUEST TIMELINE</span>

                    <h1>Waterfall</h1>

                    <p id="waterfall-filename" class="text-muted">No file analyzed yet.</p>
                </div>

                <div class="waterfall-controls">

                    <label for="waterfall-sort">Sort</label>

                    <select id="waterfall-sort">

                        <option value="start">Start time</option>

                        <option value="duration">Duration</option>

                        <option value="size">Size</option>

                    </select>

                </div>

            </header>


            <section class="waterfall-section" aria-labelledby="waterfall-heading">

                <h2 id="waterfall-heading" class="sr-only">Request waterfall</h2>

                <div id="waterfall-empty" class="waterfall-empty">No HAR analysis is available.Upload a HAR file first.</div>


                <div id="waterfall" class="waterfall" hidden>
                    <div class="waterfall__scale">
                        <div class="waterfall__request-label">REQUEST</div>
                        <div id="waterfall-scale" class="waterfall__timeline"></div>
                    </div>
                    <div id="waterfall-rows" class="waterfall__rows"></div>
                </div>
            </section>

            <section class="waterfall-legend">
                <span class="section-label">PHASES</span>
                <div class="waterfall-legend__items">
                    <div class="waterfall-legend__item">
                        <span class="legend-dot legend-dot--blocked"></span>
                        Blocked
                    </div>
                    <div class="waterfall-legend__item">
                        <span class="legend-dot legend-dot--dns"></span>
                        DNS
                    </div>
                    <div class="waterfall-legend__item">
                        <span class="legend-dot legend-dot--connect"></span>
                        Connect
                    </div>
                    <div class="waterfall-legend__item">
                        <span class="legend-dot legend-dot--wait"></span>
                        Wait / TTFB
                    </div>
                    <div class="waterfall-legend__item">
                        <span class="legend-dot legend-dot--receive"></span>
                        Receive
                    </div>
                  </div>
            </section>
        </div>
    </main>
</div>
<script src="js/storage.js"></script>
<script src="js/parser.js"></script>
<script src="js/analyzer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
